name: Colors & Notes CI/CD

on:
  push:
    branches: ["main", "dev", "develop", "refactor/*"]
  pull_request:
    branches: ["main", "dev", "develop"]
  workflow_dispatch:

jobs:
  # 1. Quality Assurance (Linting & Unit Tests)
  quality_check:
    name: 🛡️ Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: 🏗️ Generate Mocks
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🧹 Linting
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 🧪 Unit Tests
        run: flutter test test/unit

      - name: 🧩 Widget Tests
        run: flutter test test/widget

  # 2. Build & Deploy (On push and manual triggers)
  build_and_deploy:
    name: 🚀 Build & Deploy
    needs: quality_check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.FIREBASE_SERVICE_ACCOUNT_STG }}
      FIREBASE_APP_ID_ANDROID: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_ANDROID_APP_ID_PROD || secrets.FIREBASE_ANDROID_APP_ID_STG }}
      FIREBASE_PROJECT_ID: ${{ github.ref == 'refs/heads/main' && 'colors-notes-prod' || 'colors-notes-staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Setup KeyStore
      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ env.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "storePassword=${{ env.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ env.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ env.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # Setup Firebase
      - name: Create google-services.json
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cp android/app/google-services.prod.json android/app/google-services.json
          else
            cp android/app/google-services.staging.json android/app/google-services.json
          fi

      # Build APK
      - name: 🏗️ Build APK
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="prod"
          else
            ENV="staging"
          fi
          flutter build apk --release --dart-define=APP_ENV=$ENV

      # Build AAB (Production)
      - name: 📦 Build AAB (Production)
        if: github.ref == 'refs/heads/main'
        run: flutter build appbundle --release --dart-define=APP_ENV=prod

      - name: 📤 Upload Production AAB Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ColorsNotes-prod-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Distribute to Firebase App Distribution
      - name: 📤 Upload to Firebase App Distribution (Staging)
        if: env.FIREBASE_CREDENTIAL_FILE_CONTENT != '' && github.ref != 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ env.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: uat-testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Automated Release from CI/CD - ${{ github.sha }}"

      - name: 📤 Upload to Firebase App Distribution (Production)
        if: env.FIREBASE_CREDENTIAL_FILE_CONTENT != '' && github.ref == 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ env.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Automated Release from CI/CD - ${{ github.sha }}"

      # Setup Node.js (needed for npm & firebase-tools)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build Web
      - name: 🌐 Build Web
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="prod"
            CLIENT_ID="48301164525-6lqqh5tc0m0jpsm4ovdpgalosve17a1m.apps.googleusercontent.com"
          else
            ENV="staging"
            CLIENT_ID="344541548510-k1vncr9ufjii7r3k4425p8sqgq5p47r6.apps.googleusercontent.com"
          fi
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|$CLIENT_ID|g" web/index.html
          flutter build web --release --dart-define=APP_ENV=$ENV

      # Deploy Web & Firestore Rules/Indexes
      - name: 🚀 Deploy Web & Firestore to Firebase
        if: env.FIREBASE_CREDENTIAL_FILE_CONTENT != ''
        env:
          FIREBASE_KEY: ${{ env.FIREBASE_CREDENTIAL_FILE_CONTENT }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cp firebase.prod.json firebase.json
          else
            cp firebase.staging.json firebase.json
          fi

          # Create credentials file cleanly
          echo "$FIREBASE_KEY" > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json

          # Deploy Firestore & Hosting
          npx firebase-tools deploy --only firestore,hosting --project "${{ env.FIREBASE_PROJECT_ID }}"

          # Clean up
          rm gcp-key.json
          rm firebase.json

  # 3. Integration Tests (Firebase Test Lab) - Optional / Scheduled
  # Running this on every push might be expensive/slow, so maybe on dispatch or nightly
  integration_tests:
    name: 🤖 Integration Tests (Firebase)
    needs: build_and_deploy
    # Only run on main or manual trigger to save credits/time
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GCLOUD_SERVICE_ACCOUNT_KEY: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_PROD || secrets.FIREBASE_SERVICE_ACCOUNT_STG }}
      FIREBASE_PROJECT_ID: ${{ github.ref == 'refs/heads/main' && 'colors-notes-prod' || 'colors-notes-staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Authenticate to Google Cloud
        if: env.GCLOUD_SERVICE_ACCOUNT_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCLOUD_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud SDK
        if: env.GCLOUD_SERVICE_ACCOUNT_KEY != ''
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      # Setup Firebase Configuration (Integration tests use dev environment & test account)
      - name: Setup google-services.json
        if: env.GCLOUD_SERVICE_ACCOUNT_KEY != ''
        run: cp android/app/google-services.dev.json android/app/google-services.json

      - name: Get Dependencies
        if: env.GCLOUD_SERVICE_ACCOUNT_KEY != ''
        run: flutter pub get

      - name: Build App APK (Debug preferred for testing usually, or profile)
        if: env.GCLOUD_SERVICE_ACCOUNT_KEY != ''
        run: flutter build apk --debug --target=integration_test/notification_flow_test.dart

      - name: Build Android Test APK
        if: env.GCLOUD_SERVICE_ACCOUNT_KEY != ''
        working-directory: android
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew app:assembleAndroidTest

      - name: 🧪 Run Notification Flow Test
        if: env.GCLOUD_SERVICE_ACCOUNT_KEY != ''
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/flutter-apk/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=redfin,version=30,locale=en,orientation=portrait \
            --device model=panther,version=33,locale=en,orientation=portrait \
            --device model=shiba,version=35,locale=en,orientation=portrait \
            --timeout 10m
